name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website (type check, unit tests, build, static checks, browser QA)
    runs-on: ubuntu-latest
    env:
      # Adds the demo pop-up to the seed content so the browser suite can exercise the pop-up flow.
      PUBLIC_SEED_DEMO_POPUP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_site.py
      - run: npx playwright install --with-deps chromium
      - name: Browser QA (responsive, overlays, forms with mocked API, pop-up, motion, CSP)
        run: |
          node scripts/qa/serve.mjs 4322 &
          sleep 2
          node scripts/qa/e2e.mjs http://localhost:4322 --popup

  studio:
    name: Sanity Studio (type check, schema validation, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      # CI-only placeholder: the schema is validated and bundled offline; nothing is deployed from CI.
      SANITY_STUDIO_PROJECT_ID: abcdefgh
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npx sanity build --yes --no-auto-updates
