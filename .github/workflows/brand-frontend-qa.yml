name: VBFA Brand & Frontend QA
on:
  push:
    branches: [feat/brand-frontend-polish]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit brand tokens, routes, links, and JavaScript
        run: python scripts/validate_frontend.py
