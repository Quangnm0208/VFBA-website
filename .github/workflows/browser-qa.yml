name: VBFA Browser Responsive QA
on:
  push:
    branches: [feat/brand-frontend-polish]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser testing tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Start local static web server
        run: |
          nohup python -m http.server 4173 --bind 127.0.0.1 > /tmp/vbfa-server.log 2>&1 &
          sleep 2
          curl -fI http://127.0.0.1:4173/index.html
      - name: Visual viewport and interaction smoke tests
        run: python scripts/browser_qa.py
      - name: Upload responsive screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbfa-responsive-browser-audit
          path: qa-artifacts/
          if-no-files-found: warn
