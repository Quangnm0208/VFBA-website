name: VBFA Sanity API probe (read-only, structure only)
# Facts for the Admin Portal identity bridge: what `users/me` returns for a token, whether the token may manage CORS.
# Prints no secret, e-mail or id. Starts only when the owner's account adds the label `run-sanity-probe` to the activation PR.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write # only to remove the trigger label
concurrency:
  group: vbfa-sanity-probe
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event.label.name == 'run-sanity-probe' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'feat/vbfa-services-activation-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vbfa-services-activation-20261022
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe
        shell: bash
        env:
          SANITY_DEPLOY_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: node scripts/qa/sanity-probe.mjs
      - name: Remove the trigger label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-sanity-probe" || true
