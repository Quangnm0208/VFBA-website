name: VBFA live E2E (real forms + real CRM on the protected Preview)
# Label-triggered twin of `VBFA Preview real-service E2E` (which lives on main and cannot be changed before the Owner's GO).
# Differences: it fails when the script fails (the main copy pipes into tee without pipefail and shows green after "30/31 passed"),
# it runs from the activation branch, and it records the source SHA and the deployed build marker.
# Never runs on push. It starts only when the owner's account adds the label `run-live-e2e` to the activation pull request.
# It writes synthetic rows (e2e-*@example.invalid) and needs the synthetic CRM accounts documented in docs/CRM.vi.md.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write # only to remove the trigger label
concurrency:
  group: vbfa-live-e2e
  cancel-in-progress: false
jobs:
  e2e:
    name: Forms + CRM against the real services
    if: >-
      github.event.label.name == 'run-live-e2e' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'feat/vbfa-services-activation-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://vfba-website-git-feat-vbfa-services-activation-20261022-quangnm.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: The Preview must be deployment-protected (the Turnstile test keys always pass)
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$SITE/" || true)"
          case "$status" in
            301|302|303|307|308|401|403) echo "Protected Preview preflight: HTTP $status";;
            *) echo "::error::Preview is not deployment-protected (unauthenticated status $status)"; exit 1;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: feat/vbfa-services-activation-20261022
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source SHA and deployed build marker
        shell: bash
        run: |
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          marker="$(curl -s -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$SITE/" | grep -o 'name="vbfa-build" content="[0-9a-f]*"' || true)"
          echo "Deployed build marker: $marker" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed build marker: $marker"
      - name: Forms and CRM (exit status of the script is the status of the step)
        shell: bash # pipefail on: a failing script must fail the job
        env:
          LIVE_E2E_BASE_URL: ${{ env.SITE }}
          LIVE_E2E_CONFIRM: write-test-rows
        run: |
          node scripts/qa/live-e2e.mjs | tee /tmp/live-e2e.log
          echo "Result lines:" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(PASS|FAIL|SKIP)|passed' /tmp/live-e2e.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-log
          path: /tmp/live-e2e.log
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the trigger label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-live-e2e" || true
